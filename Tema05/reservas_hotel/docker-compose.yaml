services:
  db-postgres:
    image: postgres:16
    container_name: db_hotel
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: alumno123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: